services:

  api:
    build: .
    container_name: taskmanager_api
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"] # DID THIS WITH GEMINI HELP CUZ IT WASNT WORKING WITH wget!
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on: # dont start API until postgres and redis pass their health checks
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy

  postgres:
    image: postgres:17
    container_name: taskmanager_postgres
    ports:
      - "127.0.0.1:5433:5432" # use localhost:5433 port to access 5432 port in docker container 
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data # saves database data in host machine only docker manages this volume
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql # initialize database schema when PostgreSQL volume is created
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"] # check postgres by pg_isready command iwth user and dbname
      interval: 5s
      timeout: 3s
      retries: 5
    

  redis:
    image: redis:7-alpine
    container_name: taskmanager_redis
    ports:
         - "127.0.0.1:6380:6379" # from our desktop we use 6380 to acess the the 6379 port in the docker container
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # ping redis to keep cheaking health
      interval: 5s
      timeout: 3s
      retries: 5
  nginx:
    image: nginx:latest
    container_name: taskmanager_nginx
    ports: 
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: