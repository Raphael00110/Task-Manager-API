name: Tests # names pipeline 

on: # wake up this pipeline on push,pull
push:
pull_request:

jobs:
  test: # run tests in ubuntu environment
    runs-on: ubuntu-latest
    services:
      postgres: # launch postgres image 17
            image: postgres:17
            env: # add credentians to postgres
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: python_backend_test
            ports:
              - 5433:5432
            options: >- #command line arguments health check ever 10s
              --health-cmd="pg_isready -U postgres -d python_backend_test"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5 

    steps:

      - uses: actions/checkout@v6 #github premade wrapper (clones the repo and pass it to VE)
      - name: Set up Python
        uses: actions/setup-python@v6 # setup the version of desired python
        with:
         python-version: "3.13"
      - name: Install Dependencies
        run: | #(about to write multiple line script) upgrade pip -> install requirments -> install pytest
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Install Postgre Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          pg_isready -h 127.0.0.1 -p 5433 -U postgres -d python_backend_test
          psql -h 127.0.0.1 -p 5433 -U postgres -d python_backend_test -c "SELECT version();"

      - name: Run Tests
        run: pytest -vv